; Include from extensions.conf. Set HOTEL_LINE_A and HOTEL_LINE_B in [globals].
; Invoke on the answering leg with Dial(...,,U(hotel-inbound^${target}^${CALLERID(num)})).
; target must identify this one endpoint, including when reached from the public trunk.
[hotel-inbound]
exten => s,1,GotoIf($["${HOTEL_RECORD_SPOOL}" = ""]?done)
 same => n,GotoIf($["${ARG1}" = ""]?done)
 same => n,GotoIf($["${ARG1}" = "${HOTEL_LINE_A}" | "${ARG1}" = "${HOTEL_LINE_B}"]?record:done)
 same => n(record),Set(REC_TO=${FILTER(0-9,${ARG1})})
 same => n,GotoIf($["${REC_TO}" != "${ARG1}"]?done)
 same => n,Set(REC_FROM=${FILTER(0-9+,${ARG2})})
 same => n,ExecIf($["${REC_FROM}" = ""]?Set(REC_FROM=anonymous))
 same => n,Set(REC_ID=${FILTER(0-9a-zA-Z.\-,${UNIQUEID})})
 same => n,Set(REC_KEY=${EPOCH}_${REC_ID}_${REC_FROM}_${REC_TO})
 same => n,Set(REC_PATH=${HOTEL_RECORD_SPOOL}/${REC_KEY})
 same => n,MixMonitor(${REC_PATH}.wav,b,/bin/mv -- ${REC_PATH}.wav ${REC_PATH}.closed.wav)
 same => n(done),Return()
