name: Verify and deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hotel-intellegence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hotel-intellegence/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hotel-intellegence/local/requirements*.txt
      - run: npm ci && npm run check && npm run build
      - run: python -m pip install -r local/requirements-test.txt
      - name: Test workflows with isolated synthetic data
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP" HOTEL_VOICE_DATA="$(mktemp -d)"
          export HOTEL_CREDENTIAL_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -m unittest discover -s local -p 'test_*.py'
      - run: tar --exclude='__pycache__' -czf "$RUNNER_TEMP/qijian.tgz" local dist-local
      - uses: actions/upload-artifact@v4
        with:
          name: qijian
          path: ${{ runner.temp }}/qijian.tgz
          retention-days: 3
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: qijian-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qijian
      - name: Deploy the verified commit
        env:
          SSH_KEY: ${{ secrets.QIJIAN_DEPLOY_KEY }}
          SSH_HOST_KEY: ${{ secrets.QIJIAN_KNOWN_HOSTS }}
          TARGET: ${{ secrets.QIJIAN_TARGET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) != "$GITHUB_SHA" ]]; then
            echo "Superseded by a newer main commit"
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/qijian
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -i ~/.ssh/qijian "$TARGET" "$GITHUB_SHA" < qijian.tgz
